name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches:
      - 'release/v0.4.8-document-core-consolidation'
      - 'feature/maintenance-v1-batch1-vendor-foundation'
      - 'feature/maintenance-v1-batch2-legacy-vendor-patch'
      - 'ci/maintenance-v1-batch5-required-fix-validation'
    paths:
      - 'BUILD-v0.4.8'
      - 'BUILD-maintenance-v1-batch1'
      - 'BUILD-maintenance-v1-batch2'
      - 'BUILD-maintenance-v1-batch5-fix1'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-desktop-v0.4.8-windows
          path: release/*.exe
          if-no-files-found: error
