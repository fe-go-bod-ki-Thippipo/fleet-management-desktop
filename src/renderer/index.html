<!doctype html><!-- Compatibility renderer entry; Electron v0.1.2 uses /index.html as canonical entry. --><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet & Machinery Desktop</title><link rel="stylesheet" href="styles.css"></head><body>
<aside><div class="brand"><div class="logo">FM</div><div><b>Fleet & Machinery</b><small id="version">Desktop</small></div></div><nav><button data-view="dashboard" class="active">ภาพรวม</button><button data-view="assets">ทรัพย์สิน</button><button data-view="usage">การใช้รถ/เครื่องจักร</button><button data-view="maintenance">ซ่อมบำรุง <span>โครงสร้างพร้อม</span></button><button data-view="fuel">เชื้อเพลิง/ต้นทุน <span>โครงสร้างพร้อม</span></button></nav><div class="bottom"><button id="backupBtn">สำรองข้อมูล</button><small id="dataPath"></small></div></aside>
<main><header><div><h1 id="title">ภาพรวม</h1><p id="subtitle">Offline-first Fleet & Machinery Management</p></div><div class="badge">LOCAL</div></header><section id="content"></section></main>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialog-head"><h2>บันทึกคำขอใช้รถ/เครื่องจักร</h2><button id="closeModal">×</button></div><form id="usageForm"><label>ผู้ขอใช้<input name="requester_name" required></label><label>หน่วยงาน<input name="department_name"></label><label class="wide">วัตถุประสงค์<input name="purpose" required></label><label class="wide">ปลายทาง<input name="destination"></label><label>เริ่มใช้<input type="datetime-local" name="planned_start_at" required></label><label>สิ้นสุด<input type="datetime-local" name="planned_end_at" required></label><label class="wide">รถ/เครื่องจักร<select name="assigned_asset_id" id="assetSelect"><option value="">ยังไม่จัดสรร</option></select></label><div class="actions wide"><button type="button" id="cancelModal">ยกเลิก</button><button class="primary" type="submit">บันทึกคำขอ</button></div></form></div></div>
<script src="app.js"></script></body></html>
