<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Fleet & Machinery Desktop</title>
  <link rel="stylesheet" href="src/renderer/styles.css" />
</head>
<body>
  <aside>
    <div class="brand"><div class="logo">FM</div><div><b>Fleet Desktop</b><small>v0.2.0</small></div></div>
    <nav>
      <button data-page="dashboard" class="active">ภาพรวม</button>
      <button data-page="assets">ทรัพย์สิน</button>
      <button data-page="usage">การใช้รถ/เครื่องจักร</button>
      <button data-page="maintenance">ซ่อมบำรุง <span>ถัดไป</span></button>
      <button data-page="fuel">เชื้อเพลิง/ค่าใช้จ่าย <span>ถัดไป</span></button>
      <button data-page="people">พนักงานและผู้ใช้งาน</button>
      <button data-page="settings">ตั้งค่า</button>
    </nav>
    <div class="bottom"><small id="dbPath"></small><button id="backupBtn">สำรองฐานข้อมูล</button><button id="restoreBtn">กู้คืนฐานข้อมูล</button></div>
  </aside>
  <main>
    <header><div><h1 id="pageTitle">ภาพรวม</h1><p>Fleet & Machinery Management</p></div><div class="badge">OFFLINE / LOCAL</div></header>
    <section id="content"></section>
  </main>
  <div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div>
  <script src="src/renderer/app.js"></script>
</body>
</html>
